name: Bug report
description: Something in portparity behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security issues: do not file here. Use private vulnerability reporting (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Config, a few case lines, and the command. Remove any confidential code or data.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: portparity version, Python version, OS
      placeholder: "0.1.0, Python 3.12, Ubuntu 24.04"
    validations:
      required: true
